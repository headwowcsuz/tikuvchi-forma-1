<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buyurtma berish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: bitta telefon kengligidagi ustun (Telegram mini-app kabi), 2 bo'lim, pastda yopishqoq tugma */
:root{
  --bg:#f3f2ef; --card:#ffffff; --fg:#1d1f24; --muted:#6b6f78; --line:#e2e0da;
  --accent:#2b5bd7; --accent-fg:#ffffff; --tape:#f2c230; --danger:#c8372d; --ok:#1f8a52;
  --field:#f8f7f4;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141518; --card:#1d1f24; --fg:#ecebe7; --muted:#9a9ea7; --line:#30333a;
  --accent:#6b93ff; --accent-fg:#0f1220; --tape:#e0b52a; --danger:#ff6b5e; --ok:#4cc286; --field:#24262c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --card:#1d1f24; --fg:#ecebe7; --muted:#9a9ea7; --line:#30333a;
  --accent:#6b93ff; --accent-fg:#0f1220; --tape:#e0b52a; --danger:#ff6b5e; --ok:#4cc286; --field:#24262c; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 110px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

header.top{display:flex;flex-direction:column;gap:6px;padding:4px 2px 6px}
.tape{height:10px;border-radius:2px;background:
  repeating-linear-gradient(90deg,var(--fg) 0 1px,transparent 1px 10px) bottom/100% 5px no-repeat,
  repeating-linear-gradient(90deg,var(--fg) 0 1px,transparent 1px 50px) bottom/100% 10px no-repeat,
  var(--tape);opacity:.9}
h1{font-family:var(--display);font-weight:600;font-size:22px;margin:8px 0 0;text-wrap:balance;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chip-btn{font:inherit;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--fg);
  padding:7px 12px;border-radius:999px;cursor:pointer}
.chip-btn:hover{border-color:var(--accent)}

section.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:center;gap:10px}
.sec-num{font-family:var(--display);font-size:12px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  background:var(--tape);color:#1d1f24;flex:none}
.sec-head h2{font-family:var(--display);font-weight:500;font-size:15px;margin:0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
label{font-size:13px;font-weight:600;color:var(--fg)}
label .req{color:var(--danger)}
label .opt{color:var(--muted);font-weight:500}
input,select,textarea{font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:10px;
  padding:11px 12px;width:100%;min-width:0;outline:none;transition:border-color .15s}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.field.err input,.field.err select,.field.err textarea{border-color:var(--danger)}
.msg{font-size:12px;color:var(--danger)}
.phone{font-variant-numeric:tabular-nums}

.post-list{display:flex;flex-direction:column;gap:8px}
.post{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--field);border-radius:10px;padding:10px 12px;cursor:pointer}
.post input{width:auto;accent-color:var(--accent)}
.post b{font-weight:700}
.post small{color:var(--muted);display:block;font-size:12px}
.post:has(input:checked){border-color:var(--accent)}
.note-ex{font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--tape) 22%,transparent);border-radius:8px;padding:6px 10px}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:520px;margin:0 auto}
.primary{font:inherit;font-weight:700;font-size:16px;width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
.primary:focus-visible,.chip-btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

.result{display:flex;flex-direction:column;gap:12px}
.ok-badge{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--ok)}
.tg{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:14px 16px;white-space:pre-wrap;
  font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.tg .h{font-weight:700}
.legend{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
body{margin:0}
.primary:disabled{opacity:.6}
</style>
</head>
<body>

<div class="wrap">
  <header class="top" id="top">
    <div class="tape" aria-hidden="true"></div>
    <h1>Yetkazib berish ma'lumotlari</h1>
    <p class="sub">Buyurtmangizni yuborishimiz uchun ma'lumotlaringizni to'ldiring.</p>
  </header>

  <form id="orderForm" novalidate class="wrap" style="max-width:none">
    <section class="card">
      <div class="sec-head"><span class="sec-num">1</span><h2>Mijoz</h2></div>
      <div class="grid2">
        <div class="field"><label for="ism">Ism <span class="req">*</span></label>
          <input id="ism" placeholder="Masalan: Dilnoza" autocomplete="given-name"><div class="msg"></div></div>
        <div class="field"><label for="familiya">Familiya <span class="req">*</span></label>
          <input id="familiya" placeholder="Masalan: Karimova" autocomplete="family-name"><div class="msg"></div></div>
      </div>
      <div class="grid2">
        <div class="field"><label for="tel1">Asosiy telefon <span class="req">*</span></label>
          <input id="tel1" class="phone" inputmode="tel" placeholder="+998 (90) 123-45-67"><div class="msg"></div></div>
        <div class="field"><label for="tel2">Qo'shimcha telefon <span class="req">*</span></label>
          <input id="tel2" class="phone" inputmode="tel" placeholder="+998 (93) 765-43-21"><div class="msg"></div></div>
      </div>
    </section>

    <section class="card">
      <div class="sec-head"><span class="sec-num">2</span><h2>Manzil va pochta</h2></div>
      <div class="grid2">
        <div class="field"><label for="viloyat">Viloyat <span class="req">*</span></label>
          <select id="viloyat"><option value="">Tanlang…</option></select><div class="msg"></div></div>
        <div class="field"><label for="tuman">Tuman / shahar <span class="req">*</span></label>
          <input id="tuman" placeholder="Masalan: Chilonzor tumani"><div class="msg"></div></div>
      </div>
      <div class="field"><label for="manzil">To'liq manzil <span class="req">*</span></label>
        <textarea id="manzil" rows="2" placeholder="Mahalla, ko'cha, uy raqami, xonadon"></textarea><div class="msg"></div></div>
      <div class="field"><label for="moljal">Mo'ljal <span class="opt">(ixtiyoriy)</span></label>
        <input id="moljal" placeholder="Masalan: 45-maktab yonida"></div>

      <div class="field">
        <label>Qaysi pochta orqali yuboramiz? <span class="req">*</span></label>
        <div class="post-list" id="postList"></div>
        <div class="msg" id="pochtaMsg"></div>
      </div>
      <div class="field"><label for="filial">Pochta bo'limi raqami / filial <span class="opt">(ixtiyoriy)</span></label>
        <input id="filial" placeholder="Masalan: 100115 yoki Yunusobod filiali"></div>
    </section>
  </form>

  <div class="result" id="result" hidden>
    <div class="ok-badge">✓ Ma'lumotlar qabul qilindi</div>
    <div class="legend">Tikuvchiga (admin'ga) Telegram'da shunday xabar keladi:</div>
    <div class="tg" id="tgMsg"></div>
    <button type="button" class="chip-btn" id="back" style="align-self:flex-start">← Formaga qaytish</button>
  </div>
</div>

<div class="bar" id="bar"><div class="in"><button type="submit" form="orderForm" class="primary">Yuborish</button></div></div>

<script>
const VILOYATLAR=["Toshkent shahri","Toshkent viloyati","Andijon viloyati","Buxoro viloyati","Farg'ona viloyati","Jizzax viloyati",
 "Xorazm viloyati","Namangan viloyati","Navoiy viloyati","Qashqadaryo viloyati","Samarqand viloyati","Sirdaryo viloyati",
 "Surxondaryo viloyati","Qoraqalpog'iston Respublikasi"];
// Pochtalar ro'yxati: shu yerda qo'shish yoki o'chirish mumkin
const POCHTALAR=[["O'zbekiston pochtasi","Davlat pochtasi, tumanlarda ham bo'limi bor"],
 ["BTS Express","Bo'limgacha yoki uygacha"],
 ["EMU Express","Kuryer orqali uygacha"],
 ["Fargo","Kuryerlik xizmati"],
 ["Yandex Dostavka","Shahar ichida tez yetkazish"],
 ["Boshqa","Nomini pastdagi filial maydoniga yozing"]];

const $=s=>document.querySelector(s);
const vil=$("#viloyat");VILOYATLAR.forEach(v=>vil.add(new Option(v,v)));
$("#postList").innerHTML=POCHTALAR.map((p,i)=>`<label class="post"><input type="radio" name="pochta" id="pochta${i}" value="${p[0]}"><span><b>${p[0]}</b><small>${p[1]}</small></span></label>`).join("");

// Telefon maskasi: +998 (XX) XXX-XX-XX
function fmtPhone(v){let d=v.replace(/\D/g,"");if(d.startsWith("998"))d=d.slice(3);d=d.slice(0,9);
  if(!d)return"";let s="+998 ("+d.slice(0,2);if(d.length>=2)s+=") "+d.slice(2,5);if(d.length>=5)s+="-"+d.slice(5,7);if(d.length>=7)s+="-"+d.slice(7,9);return s}
document.querySelectorAll(".phone").forEach(el=>{el.addEventListener("input",()=>{el.value=fmtPhone(el.value)});
  el.addEventListener("focus",()=>{if(!el.value)el.value="+998 ("})});
const phoneOk=v=>v.replace(/\D/g,"").length===12;

function setErr(id,msg){const f=$("#"+id).closest(".field");f.classList.toggle("err",!!msg);f.querySelector(".msg").textContent=msg||""}
function clearErrs(){document.querySelectorAll(".field.err").forEach(f=>{f.classList.remove("err");f.querySelector(".msg").textContent=""});$("#pochtaMsg").textContent=""}
function validate(){let ok=true,first=null;const fail=(id,m)=>{setErr(id,m);ok=false;first??=$("#"+id)};
  const need=(id,m)=>{if(!$("#"+id).value.trim())fail(id,m);else setErr(id,"")};
  need("ism","Ismingizni kiriting");need("familiya","Familiyangizni kiriting");
  ["tel1","tel2"].forEach(id=>{if(!phoneOk($("#"+id).value))fail(id,"Raqam to'liq emas: +998 (XX) XXX-XX-XX");else setErr(id,"")});
  if(ok||phoneOk($("#tel1").value)&&phoneOk($("#tel2").value)){if($("#tel1").value===$("#tel2").value&&phoneOk($("#tel2").value))fail("tel2","Qo'shimcha raqam asosiysidan farq qilishi kerak")}
  need("viloyat","Viloyatni tanlang");need("tuman","Tuman yoki shaharni kiriting");need("manzil","To'liq manzilni yozing");
  const p=document.querySelector("input[name=pochta]:checked");$("#pochtaMsg").textContent=p?"":"Pochtani tanlang";if(!p){ok=false;first??=$("#pochta0")}
  if(first)first.focus();return ok}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function show(res){$("#orderForm").hidden=res;$("#bar").hidden=res;$("#top").hidden=res;$("#result").hidden=!res;scrollTo(0,0)}

// Telegram Mini App sozlamalari
// Tugma orqali ochilganda initData bo'sh keladi, shuning uchun platformaga qaraymiz
const tg=window.Telegram&&Telegram.WebApp&&Telegram.WebApp.platform&&Telegram.WebApp.platform!=="unknown"?Telegram.WebApp:null;
if(tg){tg.ready();tg.expand();document.documentElement.dataset.theme=tg.colorScheme==="dark"?"dark":"light"}

$("#orderForm").addEventListener("submit",e=>{e.preventDefault();if(!validate())return;
  const v=id=>$("#"+id).value.trim();
  const data={ism:v("ism"),familiya:v("familiya"),tel1:v("tel1"),tel2:v("tel2"),viloyat:v("viloyat"),tuman:v("tuman"),
    manzil:v("manzil"),moljal:v("moljal"),pochta:document.querySelector("input[name=pochta]:checked").value,filial:v("filial")};
  if(tg){ // Telegram ichida: ma'lumot botga yuboriladi, oyna yopiladi
    const btn=document.querySelector(".primary");btn.disabled=true;
    try{tg.sendData(JSON.stringify(data))}
    catch(err){btn.disabled=false;$("#pochtaMsg").textContent="Yuborilmadi. Formani botdagi pastki «📦 Buyurtma berish» tugmasi orqali oching."}
    return}
  // Oddiy brauzerda (sinov uchun): xabar ko'rinishini ko'rsatadi
  const g=id=>esc($("#"+id).value.trim());
  const pochta=esc(document.querySelector("input[name=pochta]:checked").value);
  const n="#"+String(Math.floor(1000+Math.random()*9000));
  const L=[`<span class="h">📦 Yangi buyurtma ${n}</span>`,"",
   `<span class="h">👤 Mijoz:</span> ${g("ism")} ${g("familiya")}`,
   `<span class="h">📞 Asosiy:</span> ${g("tel1")}`,
   `<span class="h">📞 Qo'shimcha:</span> ${g("tel2")}`,"",
   `<span class="h">📍 Manzil:</span> ${g("viloyat")}, ${g("tuman")}`,`   ${g("manzil")}`,
   g("moljal")?`   Mo'ljal: ${g("moljal")}`:null,"",
   `<span class="h">🚚 Pochta:</span> ${pochta}${g("filial")?" ("+g("filial")+")":""}`].filter(x=>x!==null);
  $("#tgMsg").innerHTML=L.join("\n");show(true)});
$("#back").onclick=()=>show(false);

</script>
</body>
</html>
